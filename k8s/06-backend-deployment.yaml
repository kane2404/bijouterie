apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     
      maxSurge: 1          
  selector:
    matchLabels:           
      app: bijouterie
      tier: backend
  template:
    metadata:
      labels:               
        app: bijouterie
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true   
        runAsUser: 1000      
      containers:
        - name: backend
          image: kane2404/bijouterie-backend:0  
          ports:
            - name: http
              containerPort: 3000
          
          envFrom:
            - configMapRef:
                name: backend-config
          
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 10    
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:              
              cpu: 50m
              memory: 96Mi
            limits:                
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]